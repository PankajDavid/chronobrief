services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: chronobrief-gateway:latest
    container_name: chronobrief-gateway
    ports:
      - "8080:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CHRONO_MODEL=${CHRONO_MODEL:-gemini-2.5-flash}
      - CHRONO_CACHE_SET_POLICY=${CHRONO_CACHE_SET_POLICY:-exact_set}
    volumes:
      - ./logs:/var/log/bifrost
    restart: unless-stopped
