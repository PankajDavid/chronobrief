name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/plugins/freshcache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/plugins/freshcache/go.mod
          cache-dependency-path: gateway/plugins/freshcache/go.sum
      - name: go test (race detector, verbose so every test is listed)
        run: go test -race -count=1 -v ./... 2>&1 | tee /tmp/go-test.txt
      - name: summary
        run: |
          echo "top-level tests passed: $(grep -cE '^--- PASS' /tmp/go-test.txt)"
          echo "top-level tests failed: $(grep -cE '^--- FAIL' /tmp/go-test.txt)"
          ! grep -qE '^(--- FAIL|FAIL)' /tmp/go-test.txt
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/check_invariants.py
      - run: python scripts/check_evidence.py
      - run: ruff check .
      - run: python -m pytest -q
