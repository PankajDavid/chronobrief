[project]
name = "chronobrief"
version = "0.1.0"
description = "Pre-meeting briefs that are never built on a story that has already moved"
requires-python = ">=3.11"
dependencies = [
  "streamlit",
  "httpx",
  "pydantic>=2",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "respx"]

[tool.setuptools]
packages = ["chronobrief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "E501", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
